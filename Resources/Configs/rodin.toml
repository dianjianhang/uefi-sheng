#
# Boot Shim Configs
# Rodin uses the Silicium BootShim handoff: LK loads the shim as a boot-header-v4
# "kernel", the shim relocates the UEFI FD to [uefi_fd].base and jumps to it.
#
[boot_shim]
requires_kernel_header = true
# PROBE BUILD: use the diagnostic shim. It paints the top of the framebuffer
# white, holds PROBE_DELAY_S seconds, then PSCI-resets, so a plain white screen
# proves the bootloader reached our code (independent of UEFI progress).
source  = "BootShimProbe.S"
defines = "-DFB_BASE=0xFCC20000 -DFB_FILL=0xE00000 -DPROBE_RESET=1 -DPROBE_DELAY_S=240"

#
# UEFI FD Configs
# FD region must match the rodin MemoryMapLib "UEFI FD" descriptor (0xA7100000, 0x300000).
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

#
# Android Boot Image Configs
# Stock rodin boot.img is Android boot header v4 (kernel-only, ramdisk in init_boot);
# BootShim supplies the kernel header, so no explicit load offsets are needed.
#
[boot_image]
header_version = 4
